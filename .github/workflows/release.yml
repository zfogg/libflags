name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: macos, arch: x86_64, runner: macos-15-intel }
          - { os: macos, arch: arm64, runner: macos-15 }
          - { os: windows, arch: x86_64, runner: windows-2022, generator: Ninja }
          - { os: windows, arch: arm64, runner: windows-11-arm, generator: Ninja }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: bash scripts/install-deps.sh linux
      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: bash scripts/install-deps.sh macos
      - name: Set up MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Validate Windows build tools
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/install-deps.ps1
      - name: Build, install, and package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist package
          for linkage in static shared; do
            shared=OFF
            [ "$linkage" = shared ] && shared=ON
            cmake -S . -B "build-$linkage" -G '${{ matrix.generator || 'Ninja' }}' \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS="$shared" \
              -DLIBFLAGS_BUILD_TESTS=OFF
            cmake --build "build-$linkage" --parallel
            cmake --install "build-$linkage" --prefix "$PWD/package/$linkage"
          done
          cp LICENSE package/
          if [ '${{ matrix.os }}' = windows ]; then
            (cd package && 7z a "../libflags-${{ matrix.os }}-${{ matrix.arch }}.zip" .)
          else
            (cd package && zip -r "../libflags-${{ matrix.os }}-${{ matrix.arch }}.zip" .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: libflags-${{ matrix.os }}-${{ matrix.arch }}
          path: '*.zip'
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: (cd dist && sha256sum *.zip > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
