name: Documentation
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ssciwr/doxygen-install@v1
      - run: doxygen Doxyfile
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs/generated/html}
      - uses: actions/deploy-pages@v4
